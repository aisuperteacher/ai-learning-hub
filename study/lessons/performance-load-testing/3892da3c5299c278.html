<!doctype html>

<title>压测入门：从请求到瓶颈 · ELI5 图解</title>
<style>
:root{--ink:#192332;--muted:#5a6573;--line:#d9e1eb;--bg:#f5f7fa;--white:#fff;--blue:#2762cc;--pale:#e9f0ff;--amber:#b87412;--red:#c24747;--green:#277b65}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1000px;margin:auto;padding:58px 26px 72px}h1,h2,p{margin:0}.eyebrow{color:var(--blue);font-size:14px;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(36px,5.8vw,61px);line-height:1.17;letter-spacing:-.04em;margin:18px 0 15px}header p{font-size:clamp(17px,2.4vw,22px);color:var(--muted);line-height:1.7}.topline{height:4px;background:#243d69;border-radius:6px;width:88px;margin:34px 0}.system-panel,.visual{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 8px 30px rgba(17,41,73,.035)}.system-panel{padding:22px 28px}.flow-svg{width:100%;height:auto;display:block}.steps{margin-top:52px}.step{margin-top:64px}.step-head{display:flex;align-items:baseline;gap:21px;margin-bottom:21px}.number{font-size:clamp(38px,6vw,58px);line-height:1;font-weight:850;color:var(--blue);letter-spacing:-.06em;flex-shrink:0}.step h2{font-size:clamp(27px,4.5vw,37px);letter-spacing:-.035em;line-height:1.3}.visual{padding:24px 27px 15px}.visual svg{display:block;width:100%;height:auto;max-height:410px}.caption{margin:16px 10px 7px;font-size:clamp(15px,2vw,19px);line-height:1.65;color:var(--muted);text-align:center}.visual svg text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.summary{margin-top:74px;background:#e9eff7;border:1px solid #cfdaea;border-radius:22px;padding:27px 31px}.summary strong{font-size:23px;display:block}.summary p{font-size:18px;line-height:1.8;margin-top:10px}.types{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 0}.types span{padding:10px 13px;background:#fff;border:1px solid #d5dfea;border-radius:10px;font-size:15px;color:#39475b;font-weight:650}footer{margin-top:38px;color:#738092;font-size:13px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;marg @media(max-width:650px){main{padding:32px 14px 52px}.step{margin-top:47px}.steps{margin-top:38px}.step-head{gap:12px;margin-bottom:13px}.visual{padding:12px 7px 10px;border-radius:18px}.system-panel{padding:12px 4px;border-radius:16px}.caption{margin:5px 8px 9px;font-size:14px}.visual svg{min-height:175px}.summary{margin-top:48px;padding:22px 18px}.summary strong{font-size:21px}.summary p{font-size:16px}.types{gap:7px}.types span{font-size:13px;padding:8px 10px}}

<body>
<main>
<header>
<div class="eyebrow">ELI5 · 系统性能</div>
<h1>压测：从请求到瓶颈</h1>
<p>请求增多，何时变慢？</p>
<div class="topline" aria-hidden="true"></div>
<div class="system-panel">
<svg class="flow-svg" viewBox="0 0 900 174" role="img" aria-label="压测器模拟请求，经网关、应用服务进入数据库，沿途测量吞吐、延迟和错误">
<defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6c7f97"/></marker></defs>
<rect x="13" y="35" width="174" height="100" rx="15" fill="#eef3f8" stroke="#b4c3d3" stroke-width="2"/><text x="100" y="93" text-anchor="middle" fill="#263649" font-size="26" font-weight="750">发压器</text>
<rect x="263" y="35" width="150" height="100" rx="15" fill="#f7f9fc" stroke="#acbdcf" stroke-width="2"/><text x="338" y="93" text-anchor="middle" fill="#263649" font-size="26" font-weight="750">网关</text>
<rect x="489" y="35" width="150" height="100" rx="15" fill="#f7f9fc" stroke="#acbdcf" stroke-width="2"/><text x="564" y="93" text-anchor="middle" fill="#263649" font-size="26" font-weight="750">服务</text>
<rect x="714" y="35" width="170" height="100" rx="15" fill="#f7f9fc" stroke="#acbdcf" stroke-width="2"/><text x="799" y="93" text-anchor="middle" fill="#263649" font-size="26" font-weight="750">数据库</text>
<path d="M188 86H258M414 86H484M639 86H709" stroke="#7288a5" stroke-width="3" marker-end="url(#ar0)"/>
<rect x="206" y="72" width="33" height="25" rx="11" fill="#2762cc"/><rect x="431" y="72" width="33" height="25" rx="11" fill="#2762cc"/><rect x="658" y="72" width="33" height="25" rx="11" fill="#2762cc"/>
<text x="450" y="161" font-size="17" font-weight="650" fill="#5e6f84" text-anchor="middle">↑ 请求 · ↓ 响应</text>
</svg>
</div>
</header>
<div class="steps">
<section class="step" aria-labelledby="s1"><div class="step-head"><span class="number">01</span><h2 id="s1">先定合格线</h2></div>
<div class="visual">
<svg viewBox="0 0 900 310" role="img" aria-label="先设定合格条件，例如百分之九十五的请求三百毫秒内响应，错误率小于百分之一，吞吐量达到一百每秒；都是示例阈值">
<circle cx="160" cy="147" r="104" fill="#eef3ff" stroke="#bfd1ef" stroke-width="3"/><circle cx="160" cy="147" r="76" fill="none" stroke="#2762cc" stroke-width="16"/><circle cx="160" cy="147" r="41" fill="none" stroke="#7fa2e6" stroke-width="13"/><circle cx="160" cy="147" r="11" fill="#2762cc"/>
<path d="M220 98L285 52" stroke="#2762cc" stroke-width="6" stroke-linecap="round"/><path d="M278 53L295 46L287 62" fill="none" stroke="#2762cc" stroke-width="5" stroke-linejoin="round"/>
<rect x="347" y="30" width="510" height="73" rx="15" fill="#eaf1ff"/><text x="373" y="75" font-size="26" font-weight="800" fill="#214e9d">P95 &lt; 300ms</text><circle cx="820" cy="67" r="14" fill="#2a866d"/><path d="M813 67L819 73L829 60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
<rect x="347" y="117" width="510" height="73" rx="15" fill="#eaf1ff"/><text x="373" y="162" font-size="26" font-weight="800" fill="#214e9d">错误率 &lt; 1%</text><circle cx="820" cy="154" r="14" fill="#2a866d"/><path d="M813 154L819 160L829 147" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
<rect x="347" y="204" width="510" height="73" rx="15" fill="#eaf1ff"/><text x="373" y="249" font-size="26" font-weight="800" fill="#214e9d">RPS ≥ 100</text><circle cx="820" cy="241" r="14" fill="#2a866d"/><path d="M813 241L819 247L829 234" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="160" y="287" text-anchor="middle" fill="#667488" font-size="18">目标</text>
</svg>
</div></section>
<section class="step" aria-labelledby="s2"><div class="step-head"><span class="number">02</span><h2 id="s2">用户多 ≠ 请求多</h2></div>
<div class="visual">
<svg viewBox="0 0 900 300" role="img" aria-label="左边是虚拟用户，中间是每秒产生的请求，右侧应用内有正在处理与排队的请求；三种数量不同">
<text x="118" y="35" text-anchor="middle" fill="#536780" font-weight="750" font-size="22">VU</text><text x="433" y="35" text-anchor="middle" fill="#536780" font-weight="750" font-size="22">RPS</text><text x="745" y="35" text-anchor="middle" fill="#536780" font-weight="750" font-size="22">并发请求</text>
<rect x="15" y="58" width="206" height="213" rx="17" fill="#f1f4f8" stroke="#d5deea"/>
<g fill="none" stroke="#536b88" stroke-width="6" stroke-linecap="round"><circle cx="66" cy="116" r="17"/><path d="M66 140V198M47 170H85"/><circle cx="130" cy="116" r="17"/><path d="M130 140V198M111 170H149"/><circle cx="193" cy="116" r="17"/><path d="M193 140V198M174 170H212"/></g>
<path d="M233 164H290" stroke="#7890a7" stroke-width="5" stroke-linecap="round"/><path d="M278 154L293 164L278 174" fill="none" stroke="#7890a7" stroke-width="5" stroke-linecap="round"/>
<rect x="308" y="58" width="252" height="213" rx="17" fill="#eaf1ff" stroke="#c6d7ef"/><g fill="#2762cc"><rect x="334" y="97" width="45" height="25" rx="12"/><rect x="395" y="97" width="45" height="25" rx="12"/><rect x="456" y="97" width="45" height="25" rx="12"/><rect x="334" y="139" width="45" height="25" rx="12"/><rect x="395" y="139" width="45" height="25" rx="12"/><rect x="456" y="139" width="45" height="25" rx="12"/><rect x="334" y="181" width="45" height="25" rx="12"/><rect x="395" y="181" width="45" height="25" rx="12"/><rect x="456" y="181" width="45" height="25" rx="12"/></g>
<path d="M576 164H631" stroke="#7890a7" stroke-width="5" stroke-linecap="round"/><path d="M618 154L633 164L618 174" fill="none" stroke="#7890a7" stroke-width="5" stroke-linecap="round"/>
<rect x="646" y="58" width="239" height="213" rx="17" fill="#f1f4f8" stroke="#d5deea"/>
<text x="662" y="91" fill="#536780" font-weight="650" font-size="19">处理</text><g fill="#2762cc"><rect x="745" y="73" width="46" height="25" rx="12"/><rect x="799" y="73" width="46" height="25" rx="12"/></g>
<path d="M665 115H866" stroke="#cfd9e6" stroke-width="3"/>
<text x="662" y="155" fill="#536780" font-weight="650" font-size="19">排队</text><g fill="#2762cc"><rect x="745" y="137" width="46" height="25" rx="12"/><rect x="799" y="137" width="46" height="25" rx="12"/></g>
<path d="M665 183H866" stroke="#cfd9e6" stroke-width="3"/><text x="755" y="222" fill="#69788c" text-anchor="middle" font-size="19">在途请求</text>
</svg>
</div></section>
<section class="step" aria-labelledby="s3"><div class="step-head"><span class="number">03</span><h2 id="s3">逐步加压</h2></div>
<div class="visual">
<svg viewBox="0 0 900 300" role="img" aria-label="横轴为时间，纵轴为负载：先预热、再爬坡、进入恒定负载，随后可单独测试突刺与长时间稳定性">
<path d="M78 32V247H862" stroke="#93a3b7" stroke-width="4" stroke-linecap="round" fill="none"/><text x="20" y="42" fill="#66778a" font-size="20">负载</text><text x="805" y="282" fill="#66778a" font-size="20">时间 →</text>
<g stroke="#e2e8f1" stroke-width="2" stroke-dasharray="5 8"><path d="M78 90H850M78 158H850M78 215H850"/></g>
<path d="M80 234H199L342 161H555L617 60H672L733 160H853" fill="none" stroke="#2762cc" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M80 234H199L342 161H555L617 60H672L733 160H853V247H80Z" fill="#eaf1ff" opacity=".72"/>
<path d="M80 234H199L342 161H555L617 60H672L733 160H853" fill="none" stroke="#2762cc" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g stroke="#b4c7df" stroke-dasharray="6 6" stroke-width="2"><path d="M200 43V247M342 43V247M555 43V247M735 43V247"/></g>
<g fill="#3c5574" font-size="18" font-weight="700" text-anchor="middle"><text x="142" y="24">预热</text><text x="270" y="24">爬坡</text><text x="447" y="24">恒压</text><text x="640" y="24">突刺</text><text x="792" y="24">恢复</text></g>
<g fill="#2762cc"><rect x="369" y="123" width="37" height="20" rx="10"/><rect x="420" y="123" width="37" height="20" rx="10"/><rect x="471" y="123" width="37" height="20" rx="10"/></g>
</svg>
</div></section>
<section class="step" aria-labelledby="s4"><div class="step-head"><span class="number">04</span><h2 id="s4">盯住三类指标</h2></div>
<div class="visual">
<svg viewBox="0 0 900 334" role="img" aria-label="三个指标面板，左侧每秒请求数RPS用于描述吞吐，中间P95和P99用于描述尾部延迟，右侧错误率衡量失败比例">
<g><rect x="13" y="18" width="272" height="288" rx="17" fill="#f6f9ff" stroke="#d7e2f4" stroke-width="2"/><text x="32" y="58" fill="#253b57" font-size="24" font-weight="800">吞吐量</text><text x="32" y="91" fill="#2762cc" font-size="29" font-weight="800">RPS / TPS</text>
<path d="M45 255H264" stroke="#b6c8e0" stroke-width="3"/><g fill="#2762cc"><rect x="55" y="193" width="31" height="62" rx="5"/><rect x="98" y="153" width="31" height="102" rx="5"/><rect x="141" y="122" width="31" height="133" rx="5"/><rect x="184" y="118" width="31" height="137" rx="5"/><rect x="227" y="119" width="31" height="136" rx="5"/></g></g>
<g><rect x="314" y="18" width="272" height="288" rx="17" fill="#f6f9ff" stroke="#d7e2f4" stroke-width="2"/><text x="332" y="58" fill="#253b57" font-size="24" font-weight="800">响应时间</text><text x="332" y="91" fill="#2762cc" font-size="29" font-weight="800">P95 / P99</text>
<path d="M337 240H566" stroke="#b6c8e0" stroke-width="3"/><g fill="#2762cc"><rect x="343" y="176" width="14" height="64" rx="6"/><rect x="366" y="176" width="14" height="64" rx="6"/><rect x="389" y="176" width="14" height="64" rx="6"/><rect x="412" y="176" width="14" height="64" rx="6"/><rect x="435" y="176" width="14" height="64" rx="6"/><rect x="458" y="176" width="14" height="64" rx="6"/><rect x="481" y="176" width="14" height="64" rx="6"/><rect x="504" y="176" width="14" height="64" rx="6"/></g><g fill="#c24747"><rect x="528" y="155" width="14" height="85" rx="6"/><rect x="551" y="118" width="14" height="122" rx="6"/></g><path d="M529 251V163" stroke="#b74b4b" stroke-width="2" stroke-dasharray="3 5"/><text x="529" y="275" font-size="18" fill="#b54747" text-anchor="middle">尾部</text></g>
<g><rect x="615" y="18" width="272" height="288" rx="17" fill="#f6f9ff" stroke="#d7e2f4" stroke-width="2"/><text x="633" y="58" fill="#253b57" font-size="24" font-weight="800">错误率</text><text x="633" y="91" fill="#c24747" font-size="29" font-weight="800">失败 / 总数</text>
<g fill="#2762cc"><rect x="642" y="135" width="29" height="22" rx="11"/><rect x="687" y="135" width="29" height="22" rx="11"/><rect x="732" y="135" width="29" height="22" rx="11"/><rect x="777" y="135" width="29" height="22" rx="11"/><rect x="822" y="135" width="29" height="22" rx="11"/><rect x="642" y="178" width="29" height="22" rx="11"/><rect x="687" y="178" width="29" height="22" rx="11"/><rect x="732" y="178" width="29" height="22" rx="11"/><rect x="777" y="178" width="29" height="22" rx="11"/></g><rect x="822" y="178" width="29" height="22" rx="11" fill="#c24747"/><path d="M832 184L841 194M841 184L832 194" stroke="white" stroke-width="2.5"/>
<path d="M655 235H852" stroke="#b6c8e0" stroke-width="3"/><text x="751" y="271" font-size="18" fill="#60758d" text-anchor="middle">超时也要算</text></g>
</svg>
</div></section>
<section class="step" aria-labelledby="s5"><div class="step-head"><span class="number">05</span><h2 id="s5">沿调用链找堵点</h2></div>
<div class="visual">
<svg viewBox="0 0 900 315" role="img" aria-label="请求沿着网关服务数据库走；数据库连接池排队变多，可能是一个需要分析的瓶颈，并需结合CPU内存GC与线程池指标判断">
<g fill="#fff" stroke="#b5c5d7" stroke-width="3"><rect x="21" y="80" width="215" height="105" rx="17"/><rect x="343" y="80" width="215" height="105" rx="17"/><rect x="665" y="80" width="215" height="105" rx="17"/></g>
<text x="128" y="137" fill="#30435a" text-anchor="middle" font-size="28" font-weight="780">网关</text><text x="450" y="137" fill="#30435a" text-anchor="middle" font-size="28" font-weight="780">应用服务</text><text x="772" y="137" fill="#30435a" text-anchor="middle" font-size="28" font-weight="780">数据库</text>
<path d="M239 133H337M560 133H659" stroke="#879bb0" stroke-width="4" stroke-linecap="round"/><path d="M329 124L341 133L329 142M651 124L663 133L651 142" fill="none" stroke="#879bb0" stroke-width="4"/>
<g fill="#2762cc"><rect x="260" y="121" width="37" height="23" rx="11"/><rect x="580" y="121" width="37" height="23" rx="11"/></g>
<path d="M771 185V214" stroke="#c24747" stroke-width="4" stroke-dasharray="5 5"/><rect x="676" y="218" width="190" height="73" rx="12" fill="#fceeed" stroke="#e4baba" stroke-width="2"/><text x="770" y="247" text-anchor="middle" fill="#ae4747" font-size="23" font-weight="750">连接池满</text><g fill="#2762cc"><rect x="703" y="257" width="39" height="20" rx="10"/><rect x="753" y="257" width="39" height="20" rx="10"/><rect x="803" y="257" width="39" height="20" rx="10"/></g>
<g fill="#6e829b"><text x="120" y="49" text-anchor="middle" font-size="20">网络 / 限流</text><text x="450" y="49" text-anchor="middle" font-size="20">CPU / GC / 线程</text><text x="771" y="49" text-anchor="middle" font-size="20">IO / 慢 SQL</text></g>
</svg>
</div></section>
<section class="step" aria-labelledby="s6"><div class="step-head"><span class="number">06</span><h2 id="s6">识别性能拐点</h2></div>
<div class="visual">
<svg viewBox="0 0 900 340" role="img" aria-label="负载增加时，吞吐量初期上升后趋于平缓，响应延迟在高负载区急剧升高；稳定容量应在不违反目标的范围内寻找">
<path d="M78 35V290H862" fill="none" stroke="#91a2b5" stroke-width="4" stroke-linecap="round"/>
<rect x="82" y="35" width="478" height="254" fill="#edf8f3" opacity=".9"/><rect x="560" y="35" width="300" height="254" fill="#fff0ef" opacity=".8"/>
<path d="M561 36V289" stroke="#c27a65" stroke-width="3" stroke-dasharray="7 8"/>
<text x="275" y="62" font-size="21" font-weight="750" fill="#277b65">稳定区</text><text x="704" y="62" font-size="21" font-weight="750" fill="#bd5151">过载区</text>
<path d="M87 277C194 232 266 159 393 135S575 130 855 130" fill="none" stroke="#2762cc" stroke-width="9" stroke-linecap="round"/>
<path d="M87 260C280 258 427 252 529 230S696 164 744 92S833 34 854 29" fill="none" stroke="#c24747" stroke-width="8" stroke-linecap="round"/>
<rect x="650" y="113" width="42" height="25" rx="12" fill="#2762cc"/><text x="709" y="133" font-size="19" fill="#214f9d" font-weight="800">吞吐</text>
<path d="M772 82L792 65" stroke="#c24747" stroke-width="2"/><text x="743" y="34" font-size="18" fill="#aa4242" font-weight="800">延迟</text>
<circle cx="560" cy="129" r="9" fill="#fff" stroke="#2762cc" stroke-width="5"/><text x="568" y="324" fill="#6b7c90" font-size="22" font-weight="750" text-anchor="middle">负载增加 →</text><text x="18" y="30" fill="#6b7c90" font-size="18">指标</text>
</svg>
</div></section>
</div>
<section class="summary" aria-label="学习小结"><strong>五种常见测试</strong><div class="types" aria-label="常见压测类型"><span>基准测试</span><span>负载测试</span><span>压力测试</span><span>峰值测试</span><span>耐久测试</span></div></section>
<footer>数字仅为示例。</footer>
</main>
</body>
</html>
